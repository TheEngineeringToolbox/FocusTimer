name: Publish Windows release asset

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to update
        required: true
        default: v1.0.1

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Publish Windows executable
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP 'focus-timer-publish'
          dotnet publish .\FocusTimer\FocusTimer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $publishDir

          $executable = Get-ChildItem -Path $publishDir -Filter 'FocusTimer.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $executable) {
            throw "FocusTimer.exe was not found below the publish directory: $publishDir"
          }

          "PUBLISH_EXECUTABLE=$($executable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create release or update executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'A release tag is required.'
          }

          $repository = '${{ github.repository }}'
          gh release view $tag --repo $repository --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:PUBLISH_EXECUTABLE --repo $repository --clobber
          } else {
            $releaseArgs = @('--repo', $repository, '--verify-tag', '--title', "FocusTimer $tag")
            $notesFile = Join-Path 'releases' "$tag.md"
            if (Test-Path -LiteralPath $notesFile) {
              $releaseArgs += @('--notes-file', $notesFile)
            } else {
              $releaseArgs += '--generate-notes'
            }
            gh release create $tag $env:PUBLISH_EXECUTABLE @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the GitHub Release failed with exit code $LASTEXITCODE."
          }
